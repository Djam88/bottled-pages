<title>Bottled Pages</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: a full-width sea at dusk as the hero with the headline over the sky, then dark navy sections; writing happens on cream ruled paper. */
:root{
  color-scheme: dark;
  --bg:#1b2a38; --bg-2:#15212c; --card:#223445; --card-2:#2b4055; --hair:rgba(243,236,220,.16); --hair-2:rgba(243,236,220,.3);
  --text:#f4eddc; --dim:#a9b5bf; --amber:#dd9a4e; --amber-hi:#eaae66; --amber-ink:#2a1c0b; --rose:#e9938a;
  --sheet:#f7f0de; --paper:#eadcbf; --line:#d6c9aa; --ink:#232a4d; --ink-dim:#6a6457; --hand-ink:#232a4d;
  --ribbon:#a8352d; --brass:#dd9a4e; --sea:#3d8a7c; --sea-deep:#1d4a47; --navy:#232a4d; --sand:#dcc592; --dusk:#e9c79c; --sun:#d88a4f;
  --key:#15212c; --key-shadow:#0c141c; --shadow:rgba(5,10,16,.4); --scrim:rgba(8,14,20,.66);
  --n1:#ffe780; --n2:#ffb9cb; --n3:#a9dcf6; --n4:#c4ea9f; --n5:#ffc98c;
  --g1:#5b8a4c; --g2:#cf8a26; --g3:#4f8fc8; --g4:#8c9c32; --g5:#c75f4d;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --r:18px; --soft:0 1px 2px rgba(0,0,0,.2),0 14px 34px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.5rem,7.4vw,4.4rem);line-height:1.02}
h1 em{font-style:italic;font-weight:500;color:var(--amber)}
h2{font-size:clamp(1.6rem,4vw,2.1rem);line-height:1.12}
h3{font-size:1.2rem}
p{margin:0}
.dim{color:var(--dim)}
.small{font-size:.9rem}
strong{font-weight:600}

/* header */
.top{position:fixed;left:0;right:0;top:0;z-index:56;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px),calc(50% - 540px)) 12px max(20px,env(safe-area-inset-left,0px),calc(50% - 540px));background:linear-gradient(180deg,rgba(21,33,44,.86),rgba(21,33,44,.5) 70%,rgba(21,33,44,0));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{font:600 1.45rem/1 var(--display);color:var(--text);letter-spacing:-.01em;white-space:nowrap}
.nav{display:flex;align-items:center;gap:2px;flex-wrap:nowrap}
.nav button,.tools button{background:transparent;border:0;box-shadow:none;color:var(--dim);font:500 1rem/1 var(--body);padding:10px 10px;border-radius:999px}
.nav button[aria-current="true"]{color:var(--text)}
.tools{display:flex}

/* hero */
.skybox{position:relative;overflow:hidden;background:var(--bg-2);height:clamp(620px,92vh,820px)}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:pointer}
.skybox::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(21,33,44,.72),rgba(21,33,44,.34) 34%,rgba(21,33,44,0) 62%)}
.herotext{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:calc(104px + env(safe-area-inset-top,0px)) 20px 0;display:flex;flex-direction:column;gap:20px;align-items:flex-start;pointer-events:none}
.herotext > *{max-width:600px}
.herotext button{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--hair-2);border-radius:999px;padding:7px 16px 7px 13px;font-size:.95rem;color:var(--text);background:rgba(21,33,44,.35)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber)}
.lead{font-size:1.16rem;line-height:1.55;color:var(--text);opacity:.86;text-shadow:0 1px 12px rgba(10,18,26,.6)}
.wave{position:absolute;left:0;right:0;bottom:-1px;z-index:2;width:100%;height:46px;display:block;pointer-events:none}
.sky-empty{display:none}

/* sections */
.wrap{max-width:1120px;margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px));padding-block:28px 72px;display:flex;flex-direction:column;gap:28px}
.under{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:center}
.moon{display:flex;gap:14px;align-items:center;min-width:0}
.moon svg{flex:none}
#moon-text{font:600 1.25rem/1.25 var(--display)}
.goal{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.days{display:flex;flex-direction:column;gap:6px;min-width:0}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.d{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--hair-2);display:inline-block}
.d.on{background:var(--amber);border-color:var(--amber)}
.d.today{outline:1.5px solid var(--text);outline-offset:2px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto}
.stat{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:12px 16px 10px;min-width:112px}
.stat b{font:600 1.9rem/1.05 var(--display);font-variant-numeric:tabular-nums;display:block;color:var(--text)}
.stat span{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.status{font-size:.82rem;color:var(--dim);flex-basis:100%}
.status[data-kind="error"]{color:var(--rose)}
.washed{background:var(--card);border:1px solid var(--amber);border-radius:var(--r);padding:16px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin:20px max(20px,env(safe-area-inset-left,0px)) 0}
.washed > div{flex:1 1 260px;min-width:0}
.washed .hand{color:var(--amber-hi)}

.cols{display:grid;grid-template-columns:330px minmax(0,1fr);gap:28px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--soft)}
.label{font:600 .8rem/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}

/* controls */
button{font:600 1.02rem/1 var(--body);color:var(--text);background:rgba(21,33,44,.45);border:1px solid var(--hair-2);border-radius:999px;padding:14px 22px;cursor:pointer;transition:transform .14s cubic-bezier(.2,.8,.2,1),background-color .15s,border-color .15s,filter .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.55;cursor:default}
button.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);box-shadow:0 8px 22px rgba(221,154,78,.28)}
button.ghost{background:transparent;border-color:transparent;color:var(--dim);padding:8px 10px;font-weight:500;white-space:nowrap}
button.danger{color:var(--rose);border-color:var(--rose);background:transparent}
@media (hover:hover){button:hover{border-color:var(--text)}button.primary:hover{background:var(--amber-hi);border-color:var(--amber-hi);transform:translateY(-1px)}button.ghost:hover{color:var(--text);border-color:transparent}}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
input,textarea,select{font:400 max(1rem,16px)/1.4 var(--body);color:var(--text);background:var(--bg-2);border:1px solid var(--hair-2);border-radius:12px;padding:12px 14px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(221,154,78,.25)}
input[type=radio]{width:auto}
textarea{resize:vertical;min-height:96px}
input::placeholder,textarea::placeholder{color:var(--dim);opacity:.75}
label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--dim);min-width:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.row > label{flex:1 1 130px}
.narrow{flex:0 1 160px !important}
.err{color:var(--rose);font-size:.92rem}
.filebtn{font:500 .9rem/1 var(--body);color:var(--dim);cursor:pointer;padding:8px 10px;flex-direction:row;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--hair-2)}
.filebtn:hover{color:var(--text)}
.filebtn:focus-within{outline:2px solid var(--amber);outline-offset:2px}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px;padding:0;border:0}
a.btn{font:600 1.02rem/1 var(--body);color:var(--amber-ink);background:var(--amber);border-radius:999px;padding:14px 22px;text-decoration:none;display:inline-block}

/* shelf */
.books{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.book{width:100%;text-align:left;border-radius:14px;padding:12px 14px;display:flex;flex-direction:row;align-items:center;gap:12px;background:var(--bg-2);border:1px solid var(--hair);line-height:1.3;font-weight:400}
.book[aria-current="true"]{background:var(--card-2);border-color:var(--amber);box-shadow:inset 4px 0 0 var(--amber)}
.book .txt{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.book .t{font:600 1.1rem/1.2 var(--display);overflow-wrap:anywhere;color:var(--text)}
.book .m{font:400 .86rem/1.3 var(--body);color:var(--dim)}
.bar{height:5px;border-radius:99px;background:var(--hair);overflow:hidden;display:block}
.bar i{display:block;height:100%;border-radius:99px;background:var(--amber)}
.badge{display:inline-block;font:600 .72rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:99px;border:1px solid var(--hair-2);color:var(--dim)}
.badge.done{color:var(--amber);border-color:var(--amber)}
.cover{width:104px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;flex:none;display:flex;align-items:flex-end;padding:9px;background:var(--tint);box-shadow:0 10px 24px rgba(0,0,0,.4),inset 6px 0 0 rgba(0,0,0,.18)}
.cover.has{padding:0;background:var(--bg-2);box-shadow:0 10px 24px rgba(0,0,0,.4)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover span{font:600 .78rem/1.15 var(--display);color:var(--sheet);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cover.sm{width:38px;padding:0;align-items:center;justify-content:center;border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.cover.sm span{font-size:1.05rem}
.coverwrap{display:flex;flex-direction:column;gap:6px;align-items:center;flex:none}
.waitlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.waitlist li{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--hair);padding-bottom:10px}
.waitlist .wt{flex:1;min-width:0;text-align:left;white-space:normal;font:400 1rem/1.3 var(--body);color:var(--text);overflow-wrap:anywhere;padding:4px 0}
.ebottle{flex:none;line-height:0}
.stamps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--hair-2);color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;gap:3px;min-width:0}
.stamp strong{font:600 .7rem/1.15 var(--body);letter-spacing:.06em;text-transform:uppercase}
.stamp span{font-size:.64rem;line-height:1.15}
.stamp.got{border:2px solid var(--amber);color:var(--amber);background:rgba(221,154,78,.12);transform:rotate(var(--rot))}

/* paper: where reading notes are written */
.hand{font-family:var(--hand);font-size:1.75rem;line-height:1.12;color:var(--navy);overflow-wrap:anywhere}
.jar-card{--note:var(--n1);background:linear-gradient(175deg,color-mix(in srgb,var(--note) 86%,white),var(--note) 30%,color-mix(in srgb,var(--note) 90%,black));color:var(--ink);border:0;border-radius:2px 2px 26px 2px/2px 2px 9px 2px;transform:rotate(-1.4deg);padding:26px 16px 18px;text-align:center;width:100%;display:block;font:400 1rem/1.4 var(--body);box-shadow:var(--soft)}
.jar-card .dim{color:rgba(40,36,28,.7)}
.jar-card .hand{color:var(--ink)}
.pad{min-height:250px;font:500 1.6rem/2.6rem var(--hand);color:var(--hand-ink);padding:2.6rem 26px 16px;border:0;border-radius:5px;background-color:var(--sheet);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.6rem - 1px),var(--line) calc(2.6rem - 1px),var(--line) 2.6rem),linear-gradient(150deg,#fbf7ea,var(--sheet) 45%,var(--paper));background-attachment:local,scroll;box-shadow:0 2px 0 rgba(255,255,255,.5) inset,0 18px 40px rgba(0,0,0,.35)}
.pad::placeholder{color:#8d897c;opacity:.85}
.pad:focus{box-shadow:0 0 0 4px rgba(221,154,78,.4),0 18px 40px rgba(0,0,0,.35)}
.pad.short{min-height:9rem}
.summary{min-height:23.4rem}
.inkrow{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:1.05rem;flex:1 1 auto;min-width:0}
.inkrow button{width:38px;height:38px;padding:0;border-radius:50%;border:3px solid transparent;background:var(--c);flex:none}
.inkrow button.notedot{border-radius:5px}
.inkrow button[aria-pressed="true"]{border-color:var(--text)}
.count{margin-left:auto;font-size:.95rem;color:var(--dim);font-variant-numeric:tabular-nums}
.items{display:flex;flex-direction:column;gap:14px;list-style:none;margin:0;padding:0}
.item{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.2rem - 1px),var(--line) calc(2.2rem - 1px),var(--line) 2.2rem),linear-gradient(150deg,#fbf7ea,var(--sheet) 45%,var(--paper));color:var(--ink);border-radius:5px;padding:2.2rem 18px 10px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;box-shadow:0 10px 24px rgba(0,0,0,.28)}
.item > div{min-width:0;overflow-wrap:anywhere}
.item .hand{font-size:1.45rem;line-height:2.2rem;white-space:pre-wrap}
.item .meta{font-size:.8rem;line-height:2.2rem;color:var(--ink-dim)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 18px;list-style:none;margin:0;padding:6px 4px 10px}
.word{--note:var(--n1);position:relative;min-height:176px;background:linear-gradient(175deg,color-mix(in srgb,var(--note) 86%,white),var(--note) 30%,color-mix(in srgb,var(--note) 90%,black));border-radius:2px 2px 26px 2px/2px 2px 9px 2px;padding:30px 16px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.2),0 16px 14px -9px rgba(0,0,0,.6),-3px 12px 10px -9px rgba(0,0,0,.35);transition:transform .16s,box-shadow .16s}
.word::before{content:"";position:absolute;left:0;right:0;top:0;height:20px;background:linear-gradient(180deg,rgba(0,0,0,.09),rgba(0,0,0,.03));border-radius:2px 2px 0 0}
.word:nth-child(3n+1){transform:rotate(-2.2deg)}
.word:nth-child(3n+2){transform:rotate(1.6deg)}
.word:nth-child(3n){transform:rotate(-.7deg)}
@media (hover:hover){.word:hover{transform:rotate(0) translateY(-4px) scale(1.03);box-shadow:0 1px 1px rgba(0,0,0,.2),0 24px 20px -10px rgba(0,0,0,.6)}}
.word .hand{font-size:1.75rem;line-height:1.05}
.handsm{font:500 1.2rem/1.2 var(--hand)}
.word .foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0 6px;margin-top:auto;font-family:var(--body)}
.word .foot span{flex:1 1 auto;color:rgba(40,36,28,.7);font-size:.8rem}
.word button.ghost{color:rgba(40,36,28,.72);font-size:.85rem;padding:6px 4px}
.item button.ghost{color:var(--ink-dim)}
.slip{background:linear-gradient(160deg,var(--sheet),var(--paper));color:var(--ink);border-radius:6px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;transform:rotate(-.6deg);align-self:flex-start;max-width:100%;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.slip .dim,.slip button.ghost{color:var(--ink-dim)}
.letter{background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px),linear-gradient(160deg,var(--sheet),var(--paper));color:var(--ink);border-radius:6px;padding:22px 20px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--soft)}
.letter .hand{white-space:pre-wrap;font-size:1.6rem;line-height:32px}
.letter .dim,.letter .small{color:var(--ink-dim)}
.letterphoto{max-width:100%;max-height:340px;border:6px solid var(--sheet);box-shadow:0 8px 20px rgba(0,0,0,.3);transform:rotate(-1deg);align-self:center}

/* notebook */
.nb-top{display:flex;gap:20px;align-items:flex-start}
.nb-top > .nb-head{flex:1;min-width:0}
.nb-head{display:flex;flex-direction:column;gap:10px}
.nb-title{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;justify-content:space-between}
.progress{display:flex;gap:14px;align-items:center}
.progress .bar{flex:1;height:8px}
.progress span:last-child{font-size:.95rem;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.ring{--p:0;flex:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--amber) calc(var(--p)*1%),var(--hair) 0)}
.ring b{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:600 .85rem/1 var(--body);color:var(--text)}
.rate{display:flex;gap:2px;align-items:center}
.rate button{padding:2px 4px;border:0;background:transparent;font-size:1.4rem;color:var(--hair-2)}
.rate button.on{color:var(--amber)}
.about{border-left:3px solid var(--amber);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:6px}
.logbox{background:var(--bg-2);border:1px solid var(--hair);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.finish{border-color:var(--amber)}
.timer{font:600 1.5rem/1 var(--display);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--bg-2);border:1px solid var(--hair);padding:5px;border-radius:999px}
.tabs button{flex:1 1 auto;border:0;background:transparent;color:var(--dim);padding:11px 14px;font-weight:500;font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--amber);color:var(--amber-ink);font-weight:600}
.prompt{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;border:1px dashed var(--hair-2);border-radius:14px;padding:12px 14px}
.prompt p{flex:1 1 220px;min-width:0;min-height:2.8em}
.empty{color:var(--dim);padding:6px 0}

/* dialogs */
.overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,7vh) 16px;overflow:auto}
.sheet{background:var(--card);border:1px solid var(--hair);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.55);padding:24px 22px;max-width:580px;width:100%;display:flex;flex-direction:column;gap:16px;transform-origin:top center;animation:unroll .35s cubic-bezier(.2,.8,.2,1)}
.sheet .slip{align-self:stretch;transform:none;padding:16px 18px}
.sheet .slip .hand{font-size:2rem}
@keyframes unroll{from{transform:translateY(18px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes carriage{from{transform:translateX(36px);opacity:0}to{opacity:1}}
.fresh{animation:carriage .3s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.rise.late{animation-delay:.09s}
.choices{display:flex;flex-direction:column;gap:10px}
.choices button{border-radius:14px;font:500 1.05rem/1.3 var(--body);text-align:left;padding:14px 16px}
.choices button.right{background:var(--sea);border-color:var(--sea);color:var(--text);opacity:1}
.choices button.wrong{border-color:var(--rose);color:var(--rose)}
.cardimg{width:100%;height:auto;border-radius:8px;display:block}
.sheet video{width:100%;max-height:50vh;background:var(--bg-2);display:block;border-radius:12px}
.recap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.recap li{border-left:3px solid var(--amber);padding-left:14px}
.recap .hand{color:var(--amber-hi)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.optlist{display:flex;flex-direction:column;gap:10px;align-items:stretch}

  var far=layout.filter(function(L){return L.far;}), heroSea=layout.filter(function(L){return L.hero&&L.sea;})[0];

    }

  }

    cx2.beginPath();cx2.ellipse(M.x+Math.sin(k*1.9+mv/1100)*(2+u*16),y,hw,0.7+u*1.5,0,0,6.283);cx2.fill();}
  /* beach: dry sand, wet band that mirrors the sky, a wash that slides in and out, pebbles, glints, foam */
  g=cx2.createLinearGradient(0,ys,0,H);g.addColorStop(0,'#7d7052');g.addColorStop(1,'#5a4d36');
  cx2.fillStyle=g;cx2.beginPath();cx2.moveTo(0,H);cx2.lineTo(0,shoreY(0,ys,mv));
  for(x=0;x<=W+8;x+=6) cx2.lineTo(x,shoreY(x,ys,mv));
  cx2.lineTo(W+8,H);cx2.closePath();cx2.fill();
  var wet=(H-ys)*0.82;
  g=cx2.createLinearGradient(0,ys,0,ys+wet);g.addColorStop(0,'rgba(12,44,78,.95)');g.addColorStop(0.55,'rgba(22,52,84,.78)');g.addColorStop(1,'rgba(22,52,84,0)');
  cx2.fillStyle=g;cx2.beginPath();cx2.moveTo(0,shoreY(0,ys,mv));
  for(x=0;x<=W+8;x+=6) cx2.lineTo(x,shoreY(x,ys,mv));
  cx2.lineTo(W+8,H);cx2.lineTo(0,H);cx2.closePath();cx2.fill();
  g=cx2.createLinearGradient(0,ys,0,ys+wet);g.addColorStop(0,'rgba(120,150,190,.2)');g.addColorStop(1,'rgba(120,150,190,0)');cx2.fillStyle=g;cx2.fillRect(0,ys+4,W,wet);
  for(k=0;k<16;k++){var v=k/15, fl2=0.5+0.5*Math.sin(mv/330+k*1.9);
    cx2.fillStyle='rgba(236,240,230,'+((0.3-v*0.2)*(0.4+0.6*fl2)*(0.5+0.5*f)).toFixed(3)+')';
    cx2.beginPath();cx2.ellipse(M.x+Math.sin(k*2.3+mv/1300)*(6+v*14),ys+8+v*wet*0.8,(26+v*40)*(0.6+0.4*fl2),1.4+v*2.2,0,0,6.283);cx2.fill();}
  var wash=ys+10+(reduce?4:Math.sin(mv/2600)*9+9)+surge*(H-ys)*0.7;
  g=cx2.createLinearGradient(0,ys,0,wash+4);g.addColorStop(0,'rgba(150,185,215,0)');g.addColorStop(1,'rgba(170,200,225,'+(0.16+0.2*surge).toFixed(2)+')');
  cx2.fillStyle=g;cx2.beginPath();cx2.moveTo(0,ys);for(x=0;x<=W+8;x+=8)cx2.lineTo(x,wash+Math.sin(x/55+mv/1900)*3+Math.sin(x/17)*1.2);cx2.lineTo(W+8,ys);cx2.closePath();cx2.fill();
  cx2.strokeStyle='rgba(235,242,250,'+(0.4+0.4*surge).toFixed(2)+')';cx2.lineWidth=1.1+surge*1.4;cx2.beginPath();for(x=0;x<=W+8;x+=8){var wy2=wash+Math.sin(x/55+mv/1900)*3+Math.sin(x/17)*1.2;if(x)cx2.lineTo(x,wy2);else cx2.moveTo(x,wy2);}cx2.stroke();
  foamDots.forEach(function(d,j){
    var px2=d[0]*W, py2=ys+22+d[1]*(H-ys-30), depth=(py2-ys)/(H-ys);
    if(j%3===0){cx2.fillStyle='rgba(8,12,18,.7)';cx2.beginPath();cx2.ellipse(px2,py2,2+depth*5,1+depth*2.2,0,0,6.283);cx2.fill();
      cx2.fillStyle='rgba(200,215,235,.35)';cx2.beginPath();cx2.ellipse(px2-0.6-depth,py2-0.5-depth*0.6,0.8+depth*1.6,0.4+depth*0.6,0,0,6.283);cx2.fill();}
    else{var sp=Math.max(0,Math.sin(mv/700+d[2]*3));if(sp>0.25)blob(cx2,px2,py2,1.5+depth*4,'rgba(235,242,255,'+(0.5*sp).toFixed(3)+')');}
  });
  sandDust.forEach(function(d){var sy=ys+wet*0.5+d[1]*(H-ys-wet*0.5);cx2.fillStyle=d[3]?'rgba(0,0,0,.26)':'rgba(226,224,205,.2)';cx2.fillRect(d[0]*W,sy,d[2],d[2]);});
  cx2.lineCap='round';cx2.shadowColor='rgba(220,235,255,.7)';cx2.shadowBlur=7;cx2.strokeStyle='rgba(238,244,250,.86)';cx2.lineWidth=2.4;cx2.beginPath();
  for(x=0;x<=W+8;x+=6){var fy=shoreY(x,ys,mv);if(x)cx2.lineTo(x,fy);else cx2.moveTo(x,fy);}
  cx2.stroke();cx2.shadowBlur=0;cx2.lineCap='butt';
  layout.forEach(function(L){if(!L.sea)bottle(L,t);});
  layout.forEach(bottleLabel);
  /* lens: darker corners and a fine film grain */
  g=cx2.createRadialGradient(W/2,H*0.56,Math.min(W,H)*0.42,W/2,H*0.56,Math.max(W,H)*0.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,10,.3)');
  cx2.fillStyle=g;cx2.fillRect(0,0,W,H);
  if(grainPat){var go=reduce?0:(Math.floor(t/90)*37)%96;cx2.save();cx2.globalAlpha=0.035;cx2.translate(-go,-((go*7)%96));cx2.fillStyle=grainPat;cx2.fillRect(0,0,W+96,H+96);cx2.restore();}
}
