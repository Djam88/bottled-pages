<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kerbside</title>
<meta name="description" content="Checks the UK parking rules for the kerb you are on and warns you before you have to move.">
<meta name="theme-color" content="#0a57a4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kerbside">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one column, phone first. Map on top, one verdict card drawn as a UK sign plate, then supporting lists. Bottom tab bar. */
:root{
  --bg:#eceff2; --surface:#ffffff; --raised:#f6f8fa; --ink:#14181d; --dim:#56616d; --line:#d3d9df;
  --blue:#0a57a4; --blue-ink:#ffffff; --ok:#15773b; --ok-bg:#e3f4e9; --warn:#9a5b00; --warn-bg:#fdf1d7; --no:#bf1e2a; --no-bg:#fde7e8; --check:#56616d; --check-bg:#e9edf1;
  --yellow:#f2c200; --red:#d3212d; --asphalt:#2d3238; --kerbstone:#9aa2aa;
  --plate:#fdfdfb; --plate-ink:#111417; --plate-edge:#111417;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,24,29,.06),0 8px 24px rgba(20,24,29,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101316; --surface:#1a1f25; --raised:#222830; --ink:#eef1f4; --dim:#9ba6b2; --line:#2d353e;
  --blue:#62a8f2; --blue-ink:#0b1622; --ok:#57c886; --ok-bg:#12301f; --warn:#f0b03c; --warn-bg:#35280c; --no:#ff7676; --no-bg:#3a1719; --check:#9ba6b2; --check-bg:#252c34;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101316; --surface:#1a1f25; --raised:#222830; --ink:#eef1f4; --dim:#9ba6b2; --line:#2d353e;
  --blue:#62a8f2; --blue-ink:#0b1622; --ok:#57c886; --ok-bg:#12301f; --warn:#f0b03c; --warn-bg:#35280c; --no:#ff7676; --no-bg:#3a1719; --check:#9ba6b2; --check-bg:#252c34;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;font-weight:600;min-height:44px}
button.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
button.quiet{background:transparent;border-color:transparent;color:var(--dim);text-decoration:underline;text-underline-offset:3px;padding-inline:6px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0}
.dim{color:var(--dim)} .small{font-size:.9rem}
.label{font:600 .78rem/1 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}

.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 110px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;gap:12px;padding-block:14px 2px}
.mark{display:flex;align-items:center;gap:10px;font:700 1.5rem/1 var(--display);letter-spacing:.01em}
.mark i{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--blue);color:var(--blue-ink);font:700 1.25rem/1 var(--display);font-style:normal}
.place{margin-left:auto;text-align:right;min-width:0}
.place b{display:block;font:600 1rem/1.2 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place span{font-size:.82rem;color:var(--dim)}
.iconbtn{width:44px;padding:0;display:grid;place-items:center;flex:none}

/* map */
.map{position:relative;height:38vh;min-height:230px;max-height:420px;border-radius:var(--r);overflow:hidden;background:var(--raised);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.map .tiles,.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .tiles img{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
.map.dark .tiles img{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.map .chip{position:absolute;left:10px;top:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;max-width:calc(100% - 20px)}
.map .chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--check);flex:none}
.map .chip.good::before{background:var(--ok)} .map .chip.rough::before{background:var(--warn)} .map .chip.bad::before{background:var(--no)}
.map .ctl{position:absolute;right:10px;bottom:26px;display:flex;flex-direction:column;gap:6px}
.map .ctl button{width:44px;height:44px;padding:0;border-radius:10px;font-size:1.2rem;box-shadow:var(--shadow)}
.map .attr{position:absolute;right:0;bottom:0;background:var(--surface);opacity:.85;font-size:.68rem;padding:1px 6px;border-top-left-radius:6px}
.map .attr a{color:var(--ink)}

/* verdict card with the sign plate */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.verdict{box-shadow:var(--shadow);border-top:6px solid var(--check)}
.verdict.ok{border-top-color:var(--ok)} .verdict.pay{border-top-color:var(--warn)} .verdict.no{border-top-color:var(--no)}
.vhead{display:flex;gap:14px;align-items:flex-start}
.vtext{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.state{align-self:flex-start;font:700 .8rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:6px;background:var(--check-bg);color:var(--check)}
.ok .state{background:var(--ok-bg);color:var(--ok)} .pay .state{background:var(--warn-bg);color:var(--warn)} .no .state{background:var(--no-bg);color:var(--no)}
.vtitle{font:600 1.55rem/1.1 var(--display)}
.leave{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--raised)}
.leave b{font:700 1.5rem/1 var(--display);font-variant-numeric:tabular-nums}
.vlines{display:flex;flex-direction:column;gap:4px;color:var(--dim);font-size:.95rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.src{font-size:.82rem;color:var(--dim)}

.plate{flex:none;width:104px;background:var(--plate);color:var(--plate-ink);border:2px solid var(--plate-edge);border-radius:8px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font:600 .78rem/1.15 var(--display)}
.plate .sym{width:40px;height:40px;display:grid;place-items:center;font:700 1.6rem/1 var(--display)}
.plate .sym.p{background:#0a57a4;color:#fff;border-radius:5px}
.plate .sym.nw{border-radius:50%;background:#0a57a4;border:5px solid #d3212d;position:relative}
.plate .sym.nw::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:5px;margin-left:-2.5px;background:#d3212d;transform:rotate(-45deg)}
.plate .sym.ns::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:5px;margin-left:-2.5px;background:#d3212d;transform:rotate(45deg)}
.plate .sym.q{border:3px solid #111417;border-radius:50%}
.plate span{display:block}
.plate .big{font-size:.95rem;font-weight:700}

/* kerb drawings */
.kerb{display:block;width:100%;height:auto;border-radius:6px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.pick{border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;font-weight:600;font-size:.9rem;line-height:1.2;min-height:0}
.pick[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}

/* reports */
.meter{height:10px;border-radius:999px;background:var(--ok);overflow:hidden;display:flex}
.meter i{background:var(--no);height:100%}
.meter.empty{background:var(--check-bg)}
.repline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.repline b{font:700 1.7rem/1 var(--display);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 14px;min-height:40px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item b{display:block;font-family:var(--display);font-size:1.05rem}
.dot{width:12px;height:12px;border-radius:50%;background:var(--check);flex:none}
.dot.ok{background:var(--ok)} .dot.pay{background:var(--warn)} .dot.no{background:var(--no)}
.metres{font:600 .95rem/1 var(--display);font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}

/* parked */
.count{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.count .big{font:700 clamp(3rem,16vw,4.6rem)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.count.soon .big{color:var(--warn)} .count.over .big{color:var(--no)}
.photo{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.banner{border-radius:12px;padding:12px 14px;background:var(--warn-bg);color:var(--warn);font-weight:600}
.banner.no{background:var(--no-bg);color:var(--no)}

/* guide */
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.guide .card{gap:8px}

/* tab bar + sheet + toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 60%,transparent)}
.tabs div{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow);width:100%;max-width:420px}
.tabs button{flex:1;border-color:transparent;background:transparent;color:var(--dim);position:relative}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabs .pip{position:absolute;top:8px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,14,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem;flex:1;min-width:120px}
.field input,.field select{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 12px;min-height:44px;font-weight:500;width:100%}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{padding:0;width:44px;min-height:44px;font-size:.85rem}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:center;font-weight:500;min-height:44px}
.check input{width:22px;height:22px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.foot{font-size:.85rem;color:var(--dim);text-align:center;padding:4px 0 8px}
@media (prefers-reduced-motion:no-preference){.me-pulse{animation:pulse 2.4s ease-out infinite}@keyframes pulse{from{r:8;opacity:.5}to{r:26;opacity:0}}}
@media (max-width:380px){.plate{width:88px}.vtitle{font-size:1.35rem}}

.filebtn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.filebtn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.filebtn:focus-within{outline:3px solid var(--blue);outline-offset:2px}
textarea{font:inherit;color:inherit;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 12px;width:100%;resize:vertical}
.sheet .verdict{box-shadow:none}

:root{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="mark"><i aria-hidden="true">P</i>Kerbside</div>
    <div class="place" id="place"><b id="place-road">Finding your street</b><span id="place-area">&nbsp;</span></div>
    <button class="iconbtn" id="settings-btn" type="button" aria-label="Settings">&#9881;</button>
  </header>

  <main id="v-here">
    <div class="app-col" style="display:flex;flex-direction:column;gap:16px">
      <div class="map" id="map" role="application" aria-label="Map of parking rules around you. Tap the map to check another spot.">
        <div class="tiles" id="tiles"></div>
        <svg id="overlay-svg" aria-hidden="true"></svg>
        <div class="chip" id="gps-chip">Finding you</div>
        <div class="ctl">
          <button type="button" id="recentre" aria-label="Back to my position" hidden>&#9678;</button>
          <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
          <button type="button" id="zoom-out" aria-label="Zoom out">&minus;</button>
        </div>
        <div class="attr">&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
      </div>
      <div id="gps-help" class="card" hidden></div>
      <div id="noreturn"></div>
      <div id="cards" style="display:flex;flex-direction:column;gap:16px"></div>
      <section class="card" id="reports" aria-labelledby="rep-h"></section>
      <section class="card" id="carparks" aria-labelledby="cp-h"></section>
      <p class="foot">The sign on the street is the law. Kerbside is a guide and can be wrong or out of date. Always read the sign before you leave the car.</p>
    </div>
  </main>

  <main id="v-parked" hidden></main>
  <main id="v-guide" hidden></main>
</div>

<nav class="tabs" aria-label="Sections"><div>
  <button type="button" data-view="here" aria-current="page">Here</button>
  <button type="button" data-view="parked">Parked<span class="pip" id="pip" hidden></span></button>
  <button type="button" data-view="guide">Guide</button>
</div></nav>
<div class="toast" id="toast" role="status" hidden></div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
"use strict";
/* ---------- rule engine: pure functions, no DOM ---------- */
var DAYS=['Mo','Tu','We','Th','Fr','Sa','Su'], DAYNAMES=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function dayIx(d){return (d.getDay()+6)%7;}
function atDay(d,off,min){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+off,0,min,0,0);}

/* "Mo-Sa 08:00-18:30; Su 10:00-16:00" -> [{days:[7],from,to}], null = at any time, undefined = could not read */
function parseHours(str){
  if(str==null) return undefined;
  str=String(str).trim().replace(/^\(+|\)+$/g,'').trim();
  if(!str) return undefined;
  if(/^24\/7$/.test(str)) return null;
  var out=[], ok=true;
  str.split(';').forEach(function(part){
    part=part.trim(); if(!part) return;
    if(/\b(off|closed)\b/.test(part)) return;
    var m=part.match(/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su|PH)\s*[-,]?\s*)+)?\s*((?:\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}\s*,?\s*)+)?$/);
    if(!m||(!m[1]&&!m[2])){ok=false;return;}
    var days=[0,0,0,0,0,0,0];
    if(m[1]){
      m[1].replace(/\s/g,'').split(',').forEach(function(tok){
        var r=tok.split('-').filter(Boolean); if(!r.length) return;
        var a=DAYS.indexOf(r[0]), b=r[1]?DAYS.indexOf(r[1]):a;
        if(a<0||b<0) return;
        for(var i=a;;i=(i+1)%7){days[i]=1;if(i===b)break;}
      });
      if(!days.some(Boolean)){ok=false;return;}
    } else days=[1,1,1,1,1,1,1];
    var times=m[2]?m[2].match(/\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/g):['00:00-24:00'];
    times.forEach(function(t){
      var p=t.split('-').map(function(x){var q=x.trim().split(':');return +q[0]*60+ +q[1];});
      if(p[1]>p[0]) out.push({days:days.slice(),from:p[0],to:Math.min(1440,p[1])});
      else if(p[1]<p[0]){
        out.push({days:days.slice(),from:p[0],to:1440});
        if(p[1]>0) out.push({days:days.map(function(_,i){return days[(i+6)%7];}),from:0,to:p[1]});
      } else out.push({days:days.slice(),from:0,to:1440});
    });
  });
  return ok&&out.length?out:undefined;
}
/* "2 hours", "30 minutes", "1 h", "90 min", "02:00" -> minutes */
function parseStay(s){
  if(s==null) return 0; s=String(s).trim().toLowerCase();
  var m=s.match(/^(\d{1,2}):(\d{2})$/); if(m) return +m[1]*60+ +m[2];
  m=s.match(/^([\d.]+)\s*(h|hr|hrs|hour|hours)\b/); if(m) return Math.round(parseFloat(m[1])*60);
  m=s.match(/^([\d.]+)\s*(m|min|mins|minute|minutes)\b/); if(m) return Math.round(parseFloat(m[1]));
  m=s.match(/^([\d.]+)\s*(d|day|days)\b/); if(m) return Math.round(parseFloat(m[1])*1440);
  m=s.match(/^(\d+)$/); if(m) return +m[1];
  return 0;
}
function activeAt(spec,d){
  if(!spec) return true;
  var m=d.getHours()*60+d.getMinutes(), di=dayIx(d);
  return spec.some(function(s){return s.days[di]&&m>=s.from&&m<s.to;});
}
/* the next moment the restriction switches on or off; null if it never does */
function nextFlip(spec,d){
  if(!spec) return null;
  var cur=activeAt(spec,d), c=[], di=dayIx(d);
  for(var k=0;k<=8;k++) spec.forEach(function(s){ if(s.days[(di+k)%7]){c.push(atDay(d,k,s.from));c.push(atDay(d,k,s.to));} });
  c=c.filter(function(t){return t>d;}).sort(function(a,b){return a-b;});
  for(var i=0;i<c.length;i++) if(activeAt(spec,c[i])!==cur) return c[i];
  return null;
}
function signTime(min){
  if(min===0||min===1440) return 'midnight'; if(min===720) return 'noon';
  var h=Math.floor(min/60), m=min%60, ap=h>=12?'pm':'am'; h=h%12||12;
  return h+(m?'.'+(m<10?'0':'')+m:'')+' '+ap;
}
function dayRange(days){
  if(days.every(Boolean)) return '';
  var runs=[], i=0;
  while(i<7){ if(days[i]){var j=i;while(j<6&&days[j+1])j++;runs.push(i===j?DAYNAMES[i]:DAYNAMES[i]+' - '+DAYNAMES[j]);i=j+1;} else i++; }
  return runs.join(', ');
}
/* sign-style lines: ["Mon - Sat", "8 am - 6.30 pm"] */
function describeHours(spec){
  if(spec===null) return ['At any time'];
  if(!spec) return [];
  var seen={}, out=[];
  spec.forEach(function(s){
    var key=s.days.join('')+':'+s.from+':'+s.to; if(seen[key]) return; seen[key]=1;
    var d=dayRange(s.days), t=(s.from===0&&s.to===1440)?'All day':signTime(s.from)+' - '+signTime(s.to);
    out.push((d?d+' ':'')+t);
  });
  return out;
}
function fmtDur(min){
  min=Math.max(0,Math.round(min));
  if(min>=1440){var dd=Math.floor(min/1440), hh=Math.round((min%1440)/60);return dd+(dd===1?' day':' days')+(hh?' '+hh+' h':'');}
  var h=Math.floor(min/60), m=min%60;
  return h?(h+(h===1?' hour':' hours')+(m?' '+m+' min':'')):m+' min';
}
function hhmm(d){return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();}
function fmtWhen(t,now){
  var a=new Date(now.getFullYear(),now.getMonth(),now.getDate()), b=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  var diff=Math.round((b-a)/86400000);

      el('p',{class:'small dim',text:'Pavement parking is banned in London and in Scotland unless signs allow it. Elsewhere it can still be an obstruction.'}),
      el('p',{class:'small'},el('a',{href:'https://www.gov.uk/guidance/the-highway-code/waiting-and-parking-238-to-252',target:'_blank',rel:'noopener',text:'The Highway Code: waiting and parking (rules 238 to 252)'})))));
}

/* ---------- settings + navigation ---------- */
$('settings-btn').addEventListener('click',function(){
  var st=state.settings;
  openSheet(el('h2',{text:'Settings'}),
    el('label',{class:'check'},el('input',{id:'st-badge',type:'checkbox',checked:!!st.badge,onchange:function(e){st.badge=e.target.checked;save();}}),'I hold a Blue Badge'),
    el('label',{class:'field'},'My permit zones (letters or codes, separated by commas)',el('input',{id:'st-zones',value:st.zones||'',maxlength:'60',oninput:function(e){st.zones=e.target.value;save();}})),
    el('label',{class:'field'},'Warn me this long before I must move',(function(){var s=el('select',{id:'st-lead',onchange:function(e){st.lead=+e.target.value;save();}});[5,10,15,20,30].forEach(function(m){var o=el('option',{value:m,text:m+' minutes'});if(m===(st.lead||15))o.selected=true;s.append(o);});return s;})()),
    el('p',{class:'small dim',text:state.spots.length+' saved '+(state.spots.length===1?'sign':'signs')+' on this phone.'}),
    el('div',{class:'row'},el('button',{class:'primary',type:'button',text:'Done',onclick:function(){closeSheet();renderHere();drawMap();}}),
      state.spots.length?el('button',{type:'button',text:'Forget my saved signs',onclick:function(){state.spots=[];save();closeSheet();renderHere();toast('Saved signs removed.');}}):null));
});
function setView(v){
  view=v; ['here','parked','guide'].forEach(function(n){$('v-'+n).hidden=n!==v;});
  [].forEach.call(document.querySelectorAll('.tabs button'),function(b){if(b.dataset.view===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  if(v==='parked') renderParked(); if(v==='guide') renderGuide(); if(v==='here'){renderHere();drawMap();}
  scrollTo(0,0);
}
[].forEach.call(document.querySelectorAll('.tabs button'),function(b){b.addEventListener('click',function(){setView(b.dataset.view);});});
$('pip').hidden=!state.session;
renderHere(); renderPlace();
if(state.session){M.c={lat:state.session.lat,lon:state.session.lon};setView('parked');}
startGps();

if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('/sw.js').catch(function(){});
})();
</script>
